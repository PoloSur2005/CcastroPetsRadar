services:
  db:
    image: postgis/postgis:15-3.4
    container_name: petradar_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-petradar}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - petradar_db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: petradar_redis
    restart: unless-stopped
    ports:
      - '6379:6379'

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: petradar_api
    restart: unless-stopped
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3000}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
    ports:
      - '${PORT:-3000}:3000'

volumes:
  petradar_db_data:
